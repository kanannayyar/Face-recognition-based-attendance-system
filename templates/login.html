<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-r from-sky-500 to-indigo-600">

  <div class="bg-white shadow-2xl rounded-2xl w-full max-w-md overflow-hidden">
    
    <!-- Header -->
    <div class="bg-gradient-to-r from-sky-600 to-indigo-700 text-white text-center py-6">
      <h1 class="text-3xl font-bold">Welcome Back</h1>
      <p class="text-sm text-blue-100">Sign in to your account</p>
    </div>

    <!-- Form Section -->
    <div class="p-8 bg-gray-50">
      <form class="space-y-5" method="POST" action="/login">
        <div>
          <label for="email" class="block text-gray-700 font-medium mb-1">Email</label>
          <input 
           type="email" 
           name="email"
           id="email"
           class="w-full border border-gray-300 p-3 rounded-lg"
           placeholder="Enter your email"
           required
          >
        </div>
        <div>
          <label for="password" class="block text-gray-700 font-medium mb-1">Password</label>
          <input 
           type="password" 
           name="password"
           id="password"
           class="w-full border border-gray-300 p-3 rounded-lg"
           placeholder="Enter your password"
           required
          >
        </div>

        <button 
          type="submit"
          class="w-full bg-gradient-to-r from-sky-600 to-indigo-600 text-white py-3 rounded-lg font-semibold hover:from-sky-700 hover:to-indigo-700 transition duration-200 shadow-md"
        >
          Sign In
        </button>
      </form>

    </div>
  </div>

</body>

</html>
